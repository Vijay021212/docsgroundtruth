[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsgroundtruth"
version = "0.1.0"
description = "Production-grade RAG system for healthcare documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Vijay Bolle", email = "mail4vijaybolle@gmail.com" }
]
license = { text = "MIT" }
keywords = ["rag", "retrieval", "generation", "healthcare", "llm"]

dependencies = [
    "ollama>=0.1.0",
    "qdrant-client>=1.7.0",
    "docling>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/yourusername/docsgroundtruth"
Documentation = "https://github.com/yourusername/docsgroundtruth#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/docsgroundtruth"]
