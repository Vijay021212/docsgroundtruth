[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsgroundtruth"
version = "0.1.0"
description = "Production-grade RAG system that answers questions only from your documents, with citations"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vijay Bolle", email = "mail4vijaybolle@gmail.com" }]
license = { text = "MIT" }
keywords = ["rag", "retrieval", "llm", "ollama", "qdrant", "docling", "healthcare"]

# Only packages our own code imports directly. Their sub-dependencies are
# resolved by uv and pinned in uv.lock.
dependencies = [
    "docling>=2.139",           # PDF parsing (layout, tables, OCR) + structure-aware chunking
    "ollama>=0.6",              # client for the local Ollama server (embeddings, later chat)
    "qdrant-client>=1.19",      # vector database, runs embedded in our process
    "pydantic-settings>=2.16",  # typed configuration from environment variables / .env
    "fastapi>=0.143",           # web API
    "uvicorn>=0.54",            # server that runs the FastAPI app
    "streamlit>=1.66.0",        # web UI for the testing playground
    "fastembed>=0.9.0",         # BM25 keyword vectors + reranker models (ONNX, CPU)
    "httpx>=0.28",              # we catch its connection error when streaming from Ollama
    "pyyaml>=6.0",              # reads the evaluation test paper
]

# Makes `uv run docsgroundtruth ...` call the main() function in cli.py.
[project.scripts]
docsgroundtruth = "docsgroundtruth.cli:main"

[project.urls]
Repository = "https://github.com/Vijay021212/docsgroundtruth"

# Development-only tools. `uv sync` installs this group automatically;
# people who just install the package don't get them.
[dependency-groups]
dev = [
    "pytest>=8",  # test runner
    "ruff>=0.6",  # linter + formatter
]

[tool.hatch.build.targets.wheel]
packages = ["src/docsgroundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and bugs, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
