# Test paper for AHM_250_Transcript.pdf.
#
# in_document:      the answer is in the PDF. `pages` lists where (PDF page numbers),
#                   and `must_include` lists words a correct answer should contain.
# not_in_document:  a healthcare question the PDF doesn't answer. The system should refuse.
#                   These are the hardest: the topic is close, so search scores may be high.
# off_topic:        nothing to do with the PDF. The system should refuse.
#
# Some questions deliberately use different words from the PDF, to test search by meaning.

questions:
  # --- The answer is in the PDF ----------------------------------------------------
  - id: q01
    type: in_document
    question: What is managed care?
    pages: [1]
    must_include: [delivery, financing]

