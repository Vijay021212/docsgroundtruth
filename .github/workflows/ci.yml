# Runs the code checker and the tests on GitHub for every push and pull request.
# The tests use fakes, so no models, Ollama or documents are needed here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date, so everyone gets the same versions.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest
